name: Deploy Portfolio Agent

on:
  push:
    branches: [main]

env:
  REGISTRY: portfolioagentcr.azurecr.io
  BACKEND_IMAGE: portfolioagentcr.azurecr.io/portfolio-backend
  RESOURCE_GROUP: rg-portfolio-agent

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name portfolioagentcr

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -t ${{ env.BACKEND_IMAGE }}:latest ./backend
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Deploy backend to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: portfolio-backend
          imageToDeploy: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # A Container App keeps serving the previous revision when a new one fails
      # to start, and the deploy action reports success regardless. That hid a
      # broken Alembic migration for weeks while production quietly ran an old
      # image. Fail the run unless the revision built from THIS commit is the one
      # actually serving traffic and answering /health.
      # Logic lives in .github/scripts so it can be unit-tested; see the
      # accompanying verify-backend-deploy.test.sh.
      - name: Verify the new revision is serving traffic
        env:
          APP_NAME: portfolio-backend
          EXPECTED_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          TIMEOUT_SECONDS: '600'
        run: bash .github/scripts/verify-backend-deploy.sh

  deploy-frontend-swa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Azure Static Web Apps
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      # The upload action can succeed without the site actually serving the new
      # bundle, so confirm the deployed index.html is reachable and references a
      # built asset before calling the deploy good.
      - name: Verify the frontend is serving
        env:
          SWA_URL: ${{ steps.swa.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          if [ -z "${SWA_URL:-}" ]; then
            echo "::warning::Static Web Apps deploy did not report a URL; skipping the serve check."
            exit 0
          fi
          url="${SWA_URL%/}"
          code=000
          for attempt in $(seq 1 10); do
            body=$(curl -sS --max-time 20 "$url/" || true)
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url/" || echo 000)
            echo "attempt $attempt: GET $url/ -> $code"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '/assets/index-'; then
              echo "Frontend is serving a built bundle."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Frontend did not serve a built bundle (last status: $code)"
          exit 1
